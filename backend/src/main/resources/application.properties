spring.application.name=lexora-backend

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/lexora}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:lexora}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:lexora_dev}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB

lexora.ai-service.base-url=${AI_SERVICE_BASE_URL:http://localhost:8000}
lexora.storage.path=${LEXORA_STORAGE_PATH:storage}
lexora.analysis.raster-dpi=${LEXORA_RASTER_DPI:300}
lexora.public-demo.enabled=${LEXORA_PUBLIC_DEMO_ENABLED:false}
lexora.public-demo.local-qa=${LEXORA_PUBLIC_DEMO_LOCAL_QA:false}

# Optional local-only lazy BookProfile association (see BookService).
# Public builds leave both unset so no source-specific profile is attached.
# lexora.book-profile.checksum=${LEXORA_BOOK_PROFILE_CHECKSUM:}
# lexora.book-profile.edition-key=${LEXORA_BOOK_PROFILE_EDITION_KEY:}

lexora.answer-key.page-range=30

# Contextual AI Assistance (optional, user-triggered). Provider credentials are
# server-side only; the browser never receives them.
lexora.assist.enabled=${LEXORA_ASSIST_ENABLED:false}
lexora.assist.provider=${LEXORA_ASSIST_PROVIDER:}
lexora.assist.model=${LEXORA_ASSIST_MODEL:}
lexora.assist.global-daily-provider-limit=${LEXORA_ASSIST_GLOBAL_DAILY_PROVIDER_LIMIT:100}
lexora.assist.session-daily-limit=${LEXORA_ASSIST_SESSION_DAILY_LIMIT:10}
lexora.assist.human-verification-ttl-minutes=${LEXORA_ASSIST_HUMAN_VERIFICATION_TTL_MINUTES:30}
lexora.assist.max-context-chars=${LEXORA_ASSIST_MAX_CONTEXT_CHARS:8000}

lexora.turnstile.site-key=${LEXORA_TURNSTILE_SITE_KEY:}
lexora.turnstile.secret-key=${LEXORA_TURNSTILE_SECRET_KEY:}

server.port=8080
server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY:none}
