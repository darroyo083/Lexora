spring.application.name=lexora-backend

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/lexora}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:lexora}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:lexora_dev}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB

lexora.ai-service.base-url=${AI_SERVICE_BASE_URL:http://localhost:8000}
lexora.storage.path=${LEXORA_STORAGE_PATH:storage}

server.port=8080
