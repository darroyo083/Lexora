[project]
name = "lexora-ai-service"
version = "0.2.0"
description = "Lexora document analysis with external Vision production and local OCR development providers"
requires-python = ">=3.12,<3.13"

dependencies = [
    "fastapi==0.140.13",
    "pydantic==2.13.4",
    "uvicorn==0.52.0",
    "pillow>=11.0.0",
]

[project.optional-dependencies]
local-ocr = [
    "paddleocr==3.7.0",
    "paddlepaddle==3.2.2",
    "opencv-contrib-python==4.10.0.84",
    "python-multipart==0.0.32",
]
test = [
    "pytest==9.1.1",
    "httpx>=0.27.0",
    "opencv-contrib-python==4.10.0.84",
    "python-multipart==0.0.32",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
