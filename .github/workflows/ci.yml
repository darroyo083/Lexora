name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  frontend:
    name: Frontend (npm ci / test / build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Run tests
        working-directory: frontend
        run: npm test
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run reader E2E tests
        working-directory: frontend
        run: npm run test:e2e
      - name: Verify production reader shell
        working-directory: frontend
        run: npm run test:e2e:production
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore

  backend:
    name: Backend (mvnw test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Run tests
        working-directory: backend
        run: ./mvnw -B -ntp test

  ai-service:
    name: AI service (light tests, no paddle)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-service/pyproject.toml
      - name: Install light dependencies (no paddlepaddle/paddleocr)
        run: pip install fastapi==0.140.13 pydantic==2.13.4 uvicorn==0.52.0 opencv-contrib-python==4.10.0.84 pillow python-multipart==0.0.32 pytest==9.1.1 httpx
      - name: Run tests (excluding OCR)
        working-directory: ai-service
        run: python -m pytest --ignore=tests/test_ocr.py

  integration:
    name: Integration (backend + postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: lexora
          POSTGRES_USER: lexora
          POSTGRES_PASSWORD: lexora_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lexora"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Package backend (skip tests)
        working-directory: backend
        run: ./mvnw -B -ntp package -DskipTests
      - name: Boot app and healthcheck
        working-directory: backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/lexora
          SPRING_DATASOURCE_USERNAME: lexora
          SPRING_DATASOURCE_PASSWORD: lexora_dev
        run: |
          set -e
          java -jar target/lexora-backend-0.1.0.jar > backend.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:8080/api/books >/dev/null 2>&1; then
              echo "Backend healthy: GET /api/books returned 200 (Flyway V001-V006 applied)"
              exit 0
            fi
            sleep 2
          done
          echo "Backend failed healthcheck" >&2
          tail -100 backend.log >&2 || true
          exit 1

  hygiene:
    name: Hygiene (whitespace + private artifact guard)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check whitespace errors
        run: |
          git diff --check "${{ github.event.pull_request.base.sha }}"...HEAD
      - name: Guard against private or binary artifacts
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          fail=0
          is_public_release_binary() {
            case "$1" in
              backend/src/main/resources/demo/lexora-synthetic-workbook.pdf|frontend/public/release/lexora-classic.webp|frontend/public/release/lexora-interactive.webp|frontend/public/release/lexora-landing.webp|frontend/public/release/lexora-mobile.webp|frontend/public/release/lexora-social.png|frontend/public/release/lexora-demo-poster.png|frontend/public/release/lexora-demo.mp4|video/public/evidence/choice-correct.webp|video/public/evidence/choice-grid.webp|video/public/evidence/classic.webp|video/public/evidence/interactive-correct.webp|video/public/evidence/interactive-start.webp|video/public/evidence/matching.webp|video/public/evidence/mobile.webp|video/public/evidence/sentence-ordering.webp)
                return 0
                ;;
            esac
            return 1
          }
          while IFS= read -r f; do
            case "$f" in
              storage/*|*/storage/*|*.pdf|*.zip|*.exe|*.dll|*.so|*.dylib|*.pem|*.key|*.jar|*.war)
                if is_public_release_binary "$f"; then
                  continue
                fi
                echo "::error::Private or binary artifact in PR: $f"
                fail=1
                ;;
              .env|.env.*)
                case "$f" in
                  .env.example) ;;
                  *)
                    echo "::error::Environment file committed in PR: $f"
                    fail=1
                    ;;
                esac
                ;;
            esac
          done < <(git diff --name-only "$base"...HEAD)
          while IFS=$'\t' read -r additions deletions file; do
            if [[ "$additions" == "-" ]] && ! is_public_release_binary "$file"; then
              echo "::error::Unapproved binary file in PR: $file"
              fail=1
            fi
          done < <(git diff --numstat "$base"...HEAD)
          exit $fail
