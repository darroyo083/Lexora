services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lexora}
      POSTGRES_USER: ${POSTGRES_USER:-lexora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lexora_dev}
    ports:
      - "${LEXORA_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lexora}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      target: dev
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/lexora
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-lexora}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-lexora_dev}
      AI_SERVICE_BASE_URL: http://ai-service:8000
      LEXORA_STORAGE_PATH: /app/storage
      LEXORA_RASTER_DPI: ${LEXORA_RASTER_DPI:-160}
      LEXORA_PUBLIC_DEMO_ENABLED: "false"
      LEXORA_PUBLIC_DEMO_LOCAL_QA: "false"
      LEXORA_ASSIST_ENABLED: ${LEXORA_ASSIST_ENABLED:-false}
      LEXORA_ASSIST_PROVIDER: ${LEXORA_ASSIST_PROVIDER:-}
      LEXORA_ASSIST_MODEL: ${LEXORA_ASSIST_MODEL:-}
      LEXORA_ASSIST_GLOBAL_DAILY_PROVIDER_LIMIT: ${LEXORA_ASSIST_GLOBAL_DAILY_PROVIDER_LIMIT:-100}
      LEXORA_ASSIST_SESSION_DAILY_LIMIT: ${LEXORA_ASSIST_SESSION_DAILY_LIMIT:-10}
      LEXORA_ASSIST_HUMAN_VERIFICATION_TTL_MINUTES: ${LEXORA_ASSIST_HUMAN_VERIFICATION_TTL_MINUTES:-30}
      LEXORA_ASSIST_MAX_CONTEXT_CHARS: ${LEXORA_ASSIST_MAX_CONTEXT_CHARS:-8000}
      LEXORA_TURNSTILE_SITE_KEY: ${LEXORA_TURNSTILE_SITE_KEY:-}
      LEXORA_TURNSTILE_SECRET_KEY: ${LEXORA_TURNSTILE_SECRET_KEY:-}
    ports:
      - "${LEXORA_BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT:-8080}:8080"
    volumes:
      - ./backend/src:/app/src
      - backend_m2:/root/.m2
      - lexora_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/books"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  ai-service:
    build:
      context: ./ai-service
      target: ${LEXORA_AI_DOCKER_TARGET:-local-runtime}
    ports:
      - "${LEXORA_BIND_ADDRESS:-127.0.0.1}:${AI_SERVICE_PORT:-8000}:8000"
    volumes:
      - ./ai-service/app:/app/app
      - ai_models:/root/.paddlex
      - lexora_storage:/app/storage
    environment:
      LEXORA_ANALYSIS_PROVIDER: ${LEXORA_ANALYSIS_PROVIDER:-local-ocr}
      OPENCODE_GO_API_KEY: ${OPENCODE_GO_API_KEY:-}
      OPENCODE_GO_MODEL: ${OPENCODE_GO_MODEL:-mimo-v2.5}
      OPENCODE_GO_BASE_URL: ${OPENCODE_GO_BASE_URL:-https://opencode.ai/zen/go/v1/chat/completions}
      LEXORA_PROVIDER_TIMEOUT_SECONDS: ${LEXORA_PROVIDER_TIMEOUT_SECONDS:-90}
      LEXORA_MAX_IMAGE_BYTES: ${LEXORA_MAX_IMAGE_BYTES:-10485760}
      LEXORA_ASSIST_PROVIDER: ${LEXORA_ASSIST_PROVIDER:-}
      LEXORA_ASSIST_API_KEY: ${LEXORA_ASSIST_API_KEY:-}
      LEXORA_ASSIST_MODEL: ${LEXORA_ASSIST_MODEL:-}
      LEXORA_ASSIST_BASE_URL: ${LEXORA_ASSIST_BASE_URL:-}
      LEXORA_ASSIST_TIMEOUT_SECONDS: ${LEXORA_ASSIST_TIMEOUT_SECONDS:-30}
      LEXORA_ASSIST_MAX_OUTPUT_TOKENS: ${LEXORA_ASSIST_MAX_OUTPUT_TOKENS:-450}
      PADDLE_PDX_MODEL_SOURCE: BOS
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-test:
    build:
      context: ./ai-service
      target: test
    profiles: ["test"]

  frontend:
    build:
      context: ./frontend
      target: dev
    environment:
      VITE_BACKEND_PROXY_TARGET: http://backend:8080
    ports:
      - "${LEXORA_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:5173"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

volumes:
  pgdata:
  ai_models:
  backend_m2:
  frontend_node_modules:
  lexora_storage:
